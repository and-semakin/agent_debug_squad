session_name: local-devin
workspace_dir: .
state_dir_name: .agent-debug-squad
host: 127.0.0.1
port: 8083
log_level: info
agents:
  - name: Devin
    backend: devin
    startup_prompt: |
      Investigate the assigned task in this local workspace.
      Report concrete evidence and keep responses concise.
    options:
      model: swe-2-high
      reasoning: high
      speed: standard
      mode: bypass
      yolo: true
      # Configure machine proxy_url/no_proxy in ~/.agent-debug-squad/backends.yaml,
      # or explicitly inherit proxy variables here.
      # inherit_env: [HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, NO_PROXY]
